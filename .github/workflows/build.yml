name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.24"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # Ebitengine links against OpenGL, X11 and ALSA on Linux. xvfb provides
      # the virtual display the next step needs.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev xvfb

      - run: go vet ./...

      # Importing Ebitengine runs an init() that opens the display, so every
      # package that transitively imports it — which is most of them — needs
      # an X server even for tests that never draw a frame. A headless runner
      # has none, hence xvfb.
      - name: Test
        run: xvfb-run -a go test ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            cgo: 0
            out: SuperDario.exe
            name: windows-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: 1
            out: SuperDario
            name: linux-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            cgo: 1
            out: SuperDario
            name: macos-arm64
          - os: macos-13
            goos: darwin
            goarch: amd64
            cgo: 1
            out: SuperDario
            name: macos-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Linux dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev

      # Regenerate the icon bundles and the Windows resource object so the
      # committed .syso can never drift from the art.
      - name: Generate icons
        shell: bash
        run: go run ./cmd/genicon .

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION="dev-${GITHUB_SHA::7}"
          LD="-s -w -X main.Version=${VERSION}"
          # no console window on Windows
          [ "${{ matrix.goos }}" = windows ] && LD="-s -w -H=windowsgui -X main.Version=${VERSION}"
          mkdir -p dist
          go build -trimpath -ldflags "$LD" -o "dist/${{ matrix.out }}" ./cmd/superdario

      - name: Bundle .app
        if: matrix.goos == 'darwin'
        run: |
          chmod +x scripts/make-app-bundle.sh
          ./scripts/make-app-bundle.sh dist/SuperDario dist/SuperDario.app "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: superdario-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
