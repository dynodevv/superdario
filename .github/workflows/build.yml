name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.24"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # Ebitengine links against OpenGL, X11 and ALSA on Linux. xvfb provides
      # the virtual display the next step needs.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev xvfb

      - run: go vet ./...

      # Importing Ebitengine runs an init() that opens the display, so every
      # package that transitively imports it — which is most of them — needs
      # an X server even for tests that never draw a frame. A headless runner
      # has none, hence xvfb.
      - name: Test
        run: xvfb-run -a go test ./...

      # The icon bundles and the Windows .syso are committed so a plain
      # `go build` produces a properly branded binary. Regenerate them here
      # and fail if anything moved, which catches art changes that were not
      # followed by `go run ./cmd/genicon .`. Done once, here, rather than in
      # every build job — genicon also imports Ebitengine, so it needs xvfb.
      - name: Check generated icons are up to date
        run: |
          xvfb-run -a go run ./cmd/genicon .
          if ! git diff --quiet -- assets cmd/superdario; then
            echo "::error::Generated icon files are stale. Run 'go run ./cmd/genicon .' and commit the result."
            git --no-pager diff --stat -- assets cmd/superdario
            exit 1
          fi

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # The localStorage backend and the js-specific main path only compile
      # under GOOS=js, so vet them in that configuration as well.
      - name: Vet the js/wasm build
        run: GOOS=js GOARCH=wasm go vet ./cmd/superdario ./internal/save

      - name: Build single-file web game
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION="dev-${GITHUB_SHA::7}"
          go run ./cmd/buildweb -version "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: superdario-web
          path: dist/web/SuperDario.html
          if-no-files-found: error

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            cgo: 0
            out: SuperDario.exe
            name: windows-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: 1
            out: SuperDario
            name: linux-amd64
          # Apple Silicon only. Intel Macs are not built for.
          - os: macos-latest
            goos: darwin
            goarch: arm64
            cgo: 1
            out: SuperDario
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Linux dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev

      # No icon generation here: the bundles and the Windows .syso are
      # committed, and the test job verifies they are current.
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION="dev-${GITHUB_SHA::7}"
          LD="-s -w -X main.Version=${VERSION}"
          # no console window on Windows
          [ "${{ matrix.goos }}" = windows ] && LD="-s -w -H=windowsgui -X main.Version=${VERSION}"
          mkdir -p dist
          go build -trimpath -ldflags "$LD" -o "dist/${{ matrix.out }}" ./cmd/superdario

      - name: Bundle .app
        if: matrix.goos == 'darwin'
        run: |
          chmod +x scripts/make-app-bundle.sh
          ./scripts/make-app-bundle.sh dist/SuperDario dist/SuperDario.app "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: superdario-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
